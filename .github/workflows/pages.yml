name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main, claude/project-thread-kbcsfd]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Give every script and stylesheet a per-deploy URL, so a browser can never mix files from
      # an old deploy (still in its cache) with a new page.
      - name: Version asset URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"(src/app\.js|app\.css)\"#\1=\"\2?v=$v\"#" index.html
          sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$v'#g" src/*.js
          grep -q "app.js?v=$v" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
